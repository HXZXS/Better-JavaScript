<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJS 数据接力 · 开发文档</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", -apple-system, "PingFang SC", "Segoe UI", Roboto, Arial, sans-serif;
       background: #f1f3f6; color: #1a2a3a; line-height: 1.6; height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 280px; background: #ffffff; border-right: 1px solid #dce2e8;
           display: flex; flex-direction: column; flex-shrink: 0; height: 100vh;
           overflow: hidden; box-shadow: 2px 0 8px rgba(0,0,0,0.02); }
.sidebar-header { padding: 20px 20px 14px 20px; border-bottom: 1px solid #eaeef2; flex-shrink: 0; }
.sidebar-header h2 { font-size: 20px; font-weight: 700; color: #0f2638; letter-spacing: -0.2px; }
.sidebar-header h2 small { font-weight: 400; font-size: 14px; color: #6f8ba0; display: block; margin-top: 2px; }
.sidebar-nav-wrap { flex: 1; overflow-y: auto; padding: 8px 10px 20px 10px; }
.sidebar-nav-wrap::-webkit-scrollbar { width: 4px; }
.sidebar-nav-wrap::-webkit-scrollbar-track { background: #f0f2f4; }
.sidebar-nav-wrap::-webkit-scrollbar-thumb { background: #c5d0db; border-radius: 10px; }
.sidebar-nav .section-title { font-size: 11px; text-transform: uppercase; color: #8a9fb0;
    padding: 14px 12px 4px 12px; letter-spacing: 0.6px; font-weight: 600; }
.sidebar-nav a { display: block; padding: 7px 14px; border-radius: 6px; color: #2c4055;
    text-decoration: none; font-size: 14px; transition: background 0.12s, color 0.12s;
    border-left: 3px solid transparent; cursor: pointer; }
.sidebar-nav a:hover { background: #eef3f8; color: #0f2638; }
.sidebar-nav a.active { background: #e4edf5; color: #1a5276; border-left-color: #2b6f9e; font-weight: 500; }
.main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #f7f9fb; }
.main-scroll { flex: 1; overflow-y: auto; padding: 28px 40px 40px 40px; }
.main-scroll::-webkit-scrollbar { width: 6px; }
.main-scroll::-webkit-scrollbar-track { background: #f0f2f5; }
.main-scroll::-webkit-scrollbar-thumb { background: #c5d0db; border-radius: 10px; }
.top-nav { display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 18px; border-bottom: 1px solid #e2e8ee; margin-bottom: 22px; flex-shrink: 0; }
.top-nav .page-info { font-size: 14px; color: #5a738a; }
.top-nav .page-info strong { color: #1a3a5c; }
.top-nav .nav-buttons { display: flex; gap: 8px; }
.top-nav .nav-buttons button { padding: 6px 18px; border: 1px solid #cbd5e0;
    border-radius: 6px; background: #ffffff; color: #1f3a4f; font-size: 13px;
    font-weight: 500; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
.top-nav .nav-buttons button:hover { background: #eef3f8; border-color: #a0b3c4; }
.top-nav .nav-buttons button:disabled { opacity: 0.4; cursor: not-allowed; background: #f5f7f9; }
.api-detail { background: #ffffff; border-radius: 14px; border: 1px solid #e2e8ee;
    padding: 28px 32px 32px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.api-detail .api-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 6px; }
.api-detail .method { font-weight: 700; font-size: 13px; padding: 2px 16px;
    border-radius: 20px; color: #fff; background: #2b6f9e; border: 1px solid #1a4f72; letter-spacing: 0.3px; }
.api-detail .method.get { background: #2980b9; border-color: #1a5276; }
.api-detail .method.post { background: #27ae60; border-color: #1a7a42; }
.api-detail .method.delete { background: #c0392b; border-color: #922b21; }
.api-detail .method.win { background: #d48c2c; border-color: #a86a18; }
.api-detail .endpoint { font-family: Consolas, "Courier New", monospace; font-size: 16px;
    background: #f0f4f9; padding: 2px 14px; border-radius: 6px; border: 1px solid #dce2ea; color: #1a2a3e; }
.api-detail .api-name { font-size: 22px; font-weight: 700; color: #0f2638; margin-left: auto; }
.api-detail .api-desc { font-size: 15px; color: #3d5569; margin: 12px 0 16px 0;
    padding: 12px 16px; background: #f6f9fc; border-radius: 8px; border-left: 4px solid #2b6f9e; }
.api-detail .api-desc strong { color: #1a3a5c; }
.api-detail .api-desc code { background: #e8eef5; padding: 1px 6px; border-radius: 3px;
    font-size: 13px; color: #c0392b; }
.params-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0 16px 0; }
.params-table th { text-align: left; padding: 8px 12px; background: #f0f4f9;
    border-bottom: 2px solid #dce2ea; color: #1f3a4f; font-weight: 600; }
.params-table td { padding: 7px 12px; border-bottom: 1px solid #eaeef3; }
.params-table .required { color: #c0392b; font-weight: 500; font-size: 12px; }
.params-table .optional { color: #6f8ba0; font-size: 12px; }
.params-table code { background: #eef3f8; padding: 1px 6px; border-radius: 3px; font-size: 13px; }
.example-block { background: #1a2a3e; color: #e8edf4; padding: 10px 16px; border-radius: 8px;
    font-family: Consolas, "Courier New", monospace; font-size: 13px; overflow-x: auto;
    margin: 8px 0 12px 0; white-space: pre-wrap; word-break: break-all; }
.example-block .label { color: #8faabc; font-size: 12px; display: block; margin-bottom: 4px; }
.example-block .label .code { color: #e8edf4; }
.test-section { margin-top: 18px; border-top: 1px solid #e2e8ee; padding-top: 18px; }
.test-section .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.test-section .row label { min-width: 80px; font-weight: 500; font-size: 13px; color: #3d5569; }
.test-section .row input, .test-section .row textarea, .test-section .row select {
    flex: 1; min-width: 150px; padding: 6px 12px; border: 1px solid #cbd5e0;
    border-radius: 6px; font-size: 13px; background: #ffffff; transition: border 0.15s; }
.test-section .row input:focus, .test-section .row textarea:focus, .test-section .row select:focus {
    border-color: #2b6f9e; outline: none; box-shadow: 0 0 0 3px rgba(43,111,158,0.08); }
.test-section .row textarea { min-height: 38px; font-family: Consolas, "Courier New", monospace; }
.test-section .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btn { padding: 6px 22px; border: 1px solid #b0bec5; border-radius: 6px; font-size: 13px;
    font-weight: 600; cursor: pointer; background: #f0f4f9; color: #1f3a4f;
    transition: background 0.12s, border-color 0.12s; }
.btn:hover { background: #e2eaf2; border-color: #8fa3b3; }
.btn-success { background: #27ae60; border-color: #1e8449; color: #fff; }
.btn-success:hover { background: #1e8449; }
.btn-outline { background: transparent; border: 1px solid #bcc9d4; }
.btn-outline:hover { background: #edf2f7; }
.result-box { margin-top: 10px; padding: 10px 14px; background: #fafcfd;
    border: 1px solid #dde3ea; border-left: 4px solid #2b6f9e;
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
    white-space: pre-wrap; word-break: break-all; max-height: 200px;
    overflow-y: auto; border-radius: 0 6px 6px 0; }
.footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid #dce2e8;
    text-align: center; font-size: 13px; color: #6f8ba0; flex-shrink: 0; }
@media (max-width: 820px) {
    .app { flex-direction: column; height: auto; }
    .sidebar { width: 100%; height: auto; max-height: 300px; border-right: none;
        border-bottom: 1px solid #dce2e8; }
    .sidebar-nav-wrap { overflow-y: auto; max-height: 180px; }
    .main { height: auto; }
    .main-scroll { padding: 16px 18px 30px 18px; }
    .top-nav { flex-wrap: wrap; gap: 10px; }
    .api-detail { padding: 18px 16px; }
    .api-detail .api-name { font-size: 18px; margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>BJS 文档 <small>v6.0.4</small></h2>
    </div>
    <div class="sidebar-nav-wrap">
        <nav class="sidebar-nav" id="sidebarNav">
            <div class="section-title">概览</div>
            <a data-id="intro" class="active">简介</a>

            <div class="section-title">基础功能</div>
            <a data-id="health">健康检查</a>
            <a data-id="open">打开路径</a>
            <a data-id="msg">弹窗消息</a>
            <a data-id="run">运行程序</a>
            <a data-id="dialog">自定义对话框</a>
            <a data-id="lanzou">蓝奏云下载</a>
            <a data-id="log">查看日志</a>
            <a data-id="sysinfo">系统信息</a>

            <div class="section-title">文件操作</div>
            <a data-id="listdir">列出目录</a>
            <a data-id="readfile">读取文件</a>
            <a data-id="writefile">写入文件</a>
            <a data-id="mkdir">创建文件夹</a>
            <a data-id="delete">删除</a>
            <a data-id="copy">复制</a>
            <a data-id="move">移动</a>
            <a data-id="rename">重命名</a>
            <a data-id="fileinfo">文件属性</a>
            <a data-id="dirsize">目录大小</a>
            <a data-id="replace">文本替换</a>

            <div class="section-title">Windows 专属</div>
            <a data-id="win-attr">文件属性设置</a>
            <a data-id="win-recycle">移至回收站</a>
            <a data-id="win-reveal">资源管理器定位</a>
            <a data-id="win-notify">系统通知</a>

            <div class="section-title">高级功能（需卡密）</div>
            <a data-id="batch-rename">批量重命名</a>
            <a data-id="sync">目录同步</a>
            <a data-id="schedule">定时任务</a>
            <a data-id="clipboard">剪贴板历史</a>
            <a data-id="watch">文件监听</a>
            <a data-id="search">全文搜索</a>
            <a data-id="versions">版本管理</a>
            <a data-id="duplicates">重复文件</a>
            <a data-id="archive">压缩包管理</a>
            <a data-id="share">局域网分享</a>
            <a data-id="share-list">共享会话管理</a>
            <a data-id="remote">远程协助</a>
            <a data-id="device">多设备同步</a>
            <a data-id="plugin">插件管理</a>
            <a data-id="script">自定义脚本</a>
        </nav>
    </div>
</aside>

<main class="main">
    <div class="main-scroll" id="mainScroll">
        <div class="top-nav">
            <div class="page-info">
                当前：<strong id="currentNavLabel">简介</strong> &nbsp;·&nbsp;
                <span id="currentNavIndex">1 / 40</span>
            </div>
            <div class="nav-buttons">
                <button id="prevBtn" onclick="navigate(-1)">← 上一项</button>
                <button id="nextBtn" onclick="navigate(1)">下一项 →</button>
            </div>
        </div>
        <div id="contentContainer"></div>
        <div class="footer">BJS 数据接力 · HXZXS</div>
    </div>
</main>
</div>

<script>
const API_BASE = 'http://127.0.0.1:8765';

const apiData = [
    {
        id: 'intro',
        name: '简介',
        method: '',
        path: '',
        desc: 'BJS 数据接力是一个本地 HTTP 服务，通过 API 让网页或脚本调用系统功能。<br><br>' +
              '基础功能（打开路径、弹窗、文件读写等）无需授权，开箱即用。' +
              'Windows 专属功能（属性设置、回收站、资源管理器定位、系统通知）也属于免费范围。<br><br>' +
              '高级功能（定时任务、文件监听、版本历史、局域网分享等）需要有效卡密激活。<br><br>' +
              '服务默认监听 <code>127.0.0.1:8765</code>，所有接口返回统一的 JSON 结构：<br>' +
              '<code>{"code":0, "msg":"ok", "data": {...}}</code> 其中 <code>code===0</code> 表示成功。',
        params: [],
        example: '',
        response: '',
        hideTest: true
    },

    // ===== 基础 =====
    {
        id: 'health',
        name: '健康检查',
        method: 'GET',
        path: '/health',
        desc: '检测服务是否正常运行。返回服务的运行状态、监听端口以及当前版本号。<br><br>' +
              '常用作前端探活，或启动脚本里先探测一下。',
        params: [],
        example: 'GET /health',
        response: '{"code":0,"status":"running","port":8765,"version":"6.0.4.α"}'
    },
    {
        id: 'open',
        name: '打开路径',
        method: 'GET',
        path: '/api/open',
        desc: '用系统默认程序打开文件或文件夹。<br><br>' +
              '文件夹会用资源管理器打开，文件会用关联程序打开。',
        params: [{ name: 'path', type: 'text', required: true, desc: '本地绝对路径' }],
        example: 'GET /api/open?path=C:\\Users',
        response: '{"code":0,"msg":"ok","data":{"path":"C:\\Users"}}'
    },
    {
        id: 'msg',
        name: '弹窗消息',
        method: 'POST',
        path: '/api/msg',
        desc: '在电脑上弹出系统消息框。支持 7 种类型，最常用的是 info、yesno 和 error。<br><br>' +
              '传 <code>image</code> 参数会显示图片弹窗，适合做通知或提醒。',
        params: [
            { name: 'text', type: 'text', required: true, desc: '消息内容' },
            { name: 'title', type: 'text', required: false, desc: '窗口标题' },
            { name: 'type', type: 'select', required: false, desc: '类型', options: ['info','warning','error','question','yesno','okcancel','yesnocancel'] },
            { name: 'image', type: 'text', required: false, desc: '图片地址' },
            { name: 'width', type: 'number', required: false, desc: '图片弹窗宽度' },
            { name: 'height', type: 'number', required: false, desc: '图片弹窗高度' }
        ],
        example: 'POST /api/msg {"text":"Hello","type":"yesno"}',
        response: '{"code":0,"data":true}'
    },
    {
        id: 'run',
        name: '运行程序',
        method: 'POST',
        path: '/api/run',
        desc: '启动本地程序，可带参数，可等待程序结束后返回。<br><br>' +
              '<code>wait=true</code> 时返回程序的退出码、标准输出和错误输出。',
        params: [
            { name: 'path', type: 'text', required: true, desc: '程序路径' },
            { name: 'args', type: 'text', required: false, desc: '命令行参数' },
            { name: 'wait', type: 'checkbox', required: false, desc: '是否等待程序结束' }
        ],
        example: 'POST /api/run {"path":"notepad.exe","args":"test.txt"}',
        response: '{"code":0,"msg":"已启动"}'
    },
    {
        id: 'dialog',
        name: '自定义对话框',
        method: 'POST',
        path: '/api/dialog',
        desc: '用 JSON 描述复杂对话框。支持 entry、text、password、combobox、checkbox、radio、progress、image、label 九种控件。<br><br>' +
              '用户点击按钮后返回所有输入值。',
        params: [{ name: 'config', type: 'textarea', required: true, desc: 'JSON 配置' }],
        example: 'POST /api/dialog {"config":"{\\"title\\":\\"输入\\",\\"controls\\":[{\\"type\\":\\"entry\\",\\"id\\":\\"name\\"}],\\"buttons\\":[\\"确定\\"]}"}',
        response: '{"code":0,"data":{"button":"确定","values":{"name":"张三"}}}'
    },
    {
        id: 'lanzou',
        name: '蓝奏云下载',
        method: 'POST',
        path: '/api/lanzou/download',
        desc: '解析蓝奏云分享链接并下载到本地。支持带密码的分享。<br><br>' +
              '返回保存的文件路径和文件名，省得自己扒真实下载地址。',
        params: [
            { name: 'url', type: 'text', required: true, desc: '蓝奏云分享链接' },
            { name: 'pwd', type: 'text', required: false, desc: '提取密码' },
            { name: 'save_path', type: 'text', required: false, desc: '保存路径' }
        ],
        example: 'POST /api/lanzou/download {"url":"https://xxx.lanzouw.com/xxx","pwd":"h0fv"}',
        response: '{"code":0,"data":{"filename":"file.zip","save_path":"D:\\downloads\\file.zip"}}'
    },
    {
        id: 'log',
        name: '查看日志',
        method: 'GET',
        path: '/api/log',
        desc: '获取后端运行日志。默认返回最近 100 行。<br><br>' +
              '日志文件位于 <code>%APPDATA%\\BJS\\bjs.log</code>，每 5MB 滚动一次。',
        params: [{ name: 'lines', type: 'number', required: false, desc: '返回行数' }],
        example: 'GET /api/log?lines=50',
        response: '{"code":0,"data":"[2026-08-13 12:00:00] INFO: 服务启动"}'
    },
    {
        id: 'sysinfo',
        name: '系统信息',
        method: 'GET',
        path: '/api/sysinfo',
        desc: '获取电脑基本信息：系统版本、CPU 核心数、内存总量、磁盘使用。<br><br>' +
              '装了 psutil 会返回更详细的数据。',
        params: [],
        example: 'GET /api/sysinfo',
        response: '{"code":0,"data":{"system":"Windows","release":"10","cpu_count":8}}'
    },

    // ===== 文件操作 =====
    {
        id: 'listdir',
        name: '列出目录',
        method: 'GET',
        path: '/api/listdir',
        desc: '读取目录内容，返回文件名、大小、修改时间。<br><br>' +
              '不传 path 时默认列出用户主目录。',
        params: [{ name: 'path', type: 'text', required: false, desc: '目录路径' }],
        example: 'GET /api/listdir?path=C:\\',
        response: '{"code":0,"data":[{"name":"Users","is_dir":true,"mtime":"2026-08-10 12:00:00"}]}'
    },
    {
        id: 'readfile',
        name: '读取文件',
        method: 'GET',
        path: '/api/readfile',
        desc: '读取文本文件内容。自动尝试 UTF-8、UTF-8-BOM、GBK、Latin-1 编码。<br><br>' +
              '支持 <code>start_line</code> 和 <code>end_line</code> 参数做分段读取，大文件读取上限 8MB。',
        params: [
            { name: 'path', type: 'text', required: true, desc: '文件路径' },
            { name: 'start_line', type: 'number', required: false, desc: '起始行号（从 1 开始）' },
            { name: 'end_line', type: 'number', required: false, desc: '结束行号' }
        ],
        example: 'GET /api/readfile?path=C:\\test.txt&start_line=1&end_line=100',
        response: '{"code":0,"data":"文件内容...","encoding":"utf-8","total_size":12345}'
    },
    {
        id: 'writefile',
        name: '写入文件',
        method: 'POST',
        path: '/api/writefile',
        desc: '写入文本内容到文件。目录不存在会自动创建。<br><br>' +
              '<code>append=true</code> 为追加模式，否则会覆盖原文件。',
        params: [
            { name: 'path', type: 'text', required: true, desc: '文件路径' },
            { name: 'content', type: 'textarea', required: true, desc: '写入内容' },
            { name: 'encoding', type: 'text', required: false, desc: '编码（默认 utf-8）' },
            { name: 'append', type: 'checkbox', required: false, desc: '是否追加' }
        ],
        example: 'POST /api/writefile {"path":"C:\\test.txt","content":"Hello"}',
        response: '{"code":0,"msg":"ok","data":{"path":"C:\\test.txt","size":5}}'
    },
    {
        id: 'mkdir',
        name: '创建文件夹',
        method: 'POST',
        path: '/api/mkdir',
        desc: '创建文件夹，自动创建中间缺失的父目录。已存在会返回错误。',
        params: [{ name: 'path', type: 'text', required: true, desc: '目录路径' }],
        example: 'POST /api/mkdir {"path":"C:\\新建文件夹"}',
        response: '{"code":0}'
    },
    {
        id: 'delete',
        name: '删除',
        method: 'POST',
        path: '/api/delete',
        desc: '删除文件或目录。<code>recursive=true</code> 时递归删除文件夹内的所有内容。<br><br>' +
              '⚠️ 永久删除，不走回收站。需要走回收站请用 <code>/api/win/recycle</code>。',
        params: [
            { name: 'path', type: 'text', required: true, desc: '要删除的路径' },
            { name: 'recursive', type: 'checkbox', required: false, desc: '是否递归' }
        ],
        example: 'POST /api/delete {"path":"C:\\temp","recursive":true}',
        response: '{"code":0}'
    },
    {
        id: 'copy',
        name: '复制',
        method: 'POST',
        path: '/api/copy',
        desc: '复制文件或文件夹。目录会整个复制过去，目标已存在时会合并。',
        params: [

let currentIndex = 0;
const total = apiData.length;

function renderDetail(index) {
    const item = apiData[index];
    if (!item) return;

    const container = document.getElementById('contentContainer');
    const label = document.getElementById('currentNavLabel');
    const idxSpan = document.getElementById('currentNavIndex');

    label.textContent = item.name;
    idxSpan.textContent = (index + 1) + ' / ' + total;
    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === total - 1);

    document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
    const targetLink = document.querySelector(`.sidebar-nav a[data-id="${item.id}"]`);
    if (targetLink) targetLink.classList.add('active');

    // 简介页
    if (item.id === 'intro') {
        container.innerHTML = `
            <div class="api-detail">
                <div class="api-name" style="margin-bottom:8px;">📖 简介</div>
                <div class="api-desc" style="border-left-color:#27ae60; background:#f4faf7;">
                    ${item.desc}
                </div>
                <div style="margin-top:12px; color:#4a6a8a; font-size:14px;">
                    <strong>侧边栏</strong> 列出所有接口，点哪个看哪个。<br>
                    <strong>上下按钮</strong> 或 <strong>键盘方向键</strong> 可逐项翻阅。<br>
                    <strong>在线测试</strong> 直接在本页调用接口，返回值实时显示。
                </div>
            </div>
        `;
        return;
    }

    let paramsHtml = '';
    if (item.params && item.params.length > 0) {
        paramsHtml = `
            <table class="params-table">
                <thead><tr><th>参数名</th><th>类型</th><th>说明</th><th>必填</th></tr></thead>
                <tbody>
                    ${item.params.map(p => `
                        <tr>
                            <td><code>${p.name}</code></td>
                            <td>${p.type === 'select' ? '选择' : p.type === 'checkbox' ? '布尔' :
                                   p.type === 'textarea' ? '文本' : p.type === 'number' ? '数字' : '文本'}</td>
                            <td>${p.desc}</td>
                            <td>${p.required ? '<span class="required">必填</span>' : '<span class="optional">可选</span>'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    // 测试工具
    let testHtml = '';
    if (!item.hideTest) {
        const inputRows = (item.params || []).map(p => {
            let inputHtml = '';
            if (p.type === 'select') {
                inputHtml = `<select id="test-in-${p.name}">${p.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
            } else if (p.type === 'checkbox') {
                inputHtml = `<input type="checkbox" id="test-in-${p.name}">`;
            } else if (p.type === 'textarea') {
                inputHtml = `<textarea id="test-in-${p.name}" rows="2" placeholder="输入 ${p.name}"></textarea>`;
            } else if (p.type === 'number') {
                inputHtml = `<input type="number" id="test-in-${p.name}" placeholder="数字">`;
            } else {
                inputHtml = `<input type="text" id="test-in-${p.name}" placeholder="输入 ${p.name}">`;
            }
            return `<div class="row"><label>${p.name}</label>${inputHtml}</div>`;
        }).join('');

        testHtml = `
            <div class="test-section">
                <div style="font-weight:600; color:#1f3a4f; margin-bottom:10px;">在线测试</div>
                ${inputRows}
                <div class="btn-group">
                    <button class="btn btn-success" onclick="testApi(${index})">测试 (${item.method})</button>
                    <button class="btn btn-outline" onclick="clearResult(${index})">清空</button>
                </div>
                <div class="result-box" id="test-result-${index}">等待测试...</div>
            </div>
        `;
    }

    container.innerHTML = `
        <div class="api-detail">
            <div class="api-head">
                ${item.method ? `<span class="method ${item.method.toLowerCase().includes('win') ? 'win' : item.method.toLowerCase().split(' ')[0]}">${item.method}</span>` : ''}
                ${item.path ? `<span class="endpoint">${item.path}</span>` : ''}
                <span class="api-name">${item.name}</span>
            </div>
            <div class="api-desc">${item.desc}</div>
            ${paramsHtml}
            ${item.example ? `
                <div style="font-weight:600; color:#1f3a4f; margin-top:12px;">示例</div>
                <div class="example-block"><span class="label">请求</span>${item.example}</div>
            ` : ''}
            ${item.response ? `
                <div class="example-block" style="background:#2c3e50;"><span class="label">响应</span>${item.response}</div>
            ` : ''}
            ${testHtml}
        </div>
    `;
}

function navigate(direction) {
    const newIndex = currentIndex + direction;
    if (newIndex < 0 || newIndex >= total) return;
    currentIndex = newIndex;
    renderDetail(currentIndex);
    document.getElementById('mainScroll').scrollTop = 0;
}
function navigateTo(id) {
    const idx = apiData.findIndex(item => item.id === id);
    if (idx === -1) return;
    currentIndex = idx;
    renderDetail(currentIndex);
    document.getElementById('mainScroll').scrollTop = 0;
}

window.testApi = function(idx) {
    const item = apiData[idx];
    const resBox = document.getElementById('test-result-' + idx);
    if (!resBox) return;
    resBox.textContent = '请求中...';
    try {
        const params = {};
        (item.params || []).forEach(p => {
            const el = document.getElementById('test-in-' + p.name);
            if (!el) return;
            let val;
            if (p.type === 'checkbox') val = el.checked;
            else if (p.type === 'number') val = parseFloat(el.value) || 0;
            else val = el.value || '';
            if (val !== undefined && val !== '' && val !== false) params[p.name] = val;
        });

        // 多方法（含空格）默认用第一个
        const method = item.method.split(' ')[0].trim();
        const path = item.path.split(' ')[0].trim();
        const url = API_BASE + path;
        const opts = { method, headers: { 'Content-Type': 'application/json' } };

        if (method === 'GET') {
            const qs = new URLSearchParams();
            for (const k in params) {
                const v = params[k];
                if (v !== undefined && v !== '' && v !== false) qs.append(k, v);
            }
            const finalUrl = qs.toString() ? url + '?' + qs.toString() : url;
            fetch(finalUrl).then(r => r.json())
                .then(data => { resBox.textContent = JSON.stringify(data, null, 2); })
                .catch(err => { resBox.textContent = '请求失败：' + err.message; });
        } else {
            opts.body = JSON.stringify(params);
            fetch(url, opts).then(r => r.json())
                .then(data => { resBox.textContent = JSON.stringify(data, null, 2); })
                .catch(err => { resBox.textContent = '请求失败：' + err.message; });
        }
    } catch (err) {
        resBox.textContent = '请求失败：' + err.message;
    }
};

window.clearResult = function(idx) {
    const box = document.getElementById('test-result-' + idx);
    if (box) box.textContent = '等待测试...';
};

document.addEventListener('keydown', function(e) {
    if (document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
});

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.sidebar-nav a').forEach(link => {
        link.addEventListener('click', function(e) {
            const id = this.getAttribute('data-id');
            if (id) navigateTo(id);
        });
    });
    currentIndex = 0;
    renderDetail(0);
});
</script>
</body>
</html>
